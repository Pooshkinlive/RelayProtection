<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расчёт уставок РЗА</title>
    <style>
        
        body { font-family: Arial, sans-serif; padding: 20px; background: #f8f9fa; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background: #e7f3ff; border-left: 4px solid #007bff; }
        .error { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
<h2>Расчёт уставок РЗА (по данным ЭТАЛОНА)</h2>

<div id="params-container"></div>
<button onclick="calculate()">Рассчитать</button>
<div id="result" style="display:none;"></div>

<script>
    let params = [];

    async function loadParams() {
        const res = await fetch('/api/parameters');
        params = await res.json();
        
        const container = document.getElementById('params-container');
        container.innerHTML = params
            .filter(p => p.engineer_input)
            .map(p => `
                <div class="form-group">
                    <label>${p.name} (${p.code}) [${p.unit}]</label>
                    <input type="number" id="${p.code}" step="0.1" value="${p.current_value || p.default_value || ''}">
                </div>
            `).join('');
    }

    async function calculate() {
        const data = {};
        params.forEach(p => {
            if (p.engineer_input) {
                const val = document.getElementById(p.code).value;
                data[p.code] = val ? parseFloat(val) : null;
            }
        });

        const res = await fetch('/api/calculate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        const result = await res.json();

        const el = document.getElementById('result');
        el.innerHTML = `
            <h3>Результаты:</h3>
            <p><strong>МТО</strong>: ${result.mto.setting_raw} А | Чувствительность: ${result.mto.sensitivity} (${result.mto.ok ? '✅ OK' : '❌ Не проходит'})</p>
            <p><strong>МТЗ</strong>: ${result.mtz.setting_raw} А | Чувствительность: ${result.mtz.sensitivity} (${result.mtz.ok ? '✅ OK' : '❌ Не проходит'})</p>
            <p><small>Критерий: МТО ≥ 1.2×I<sub>кз мин</sub>, МТЗ ≥ 1.5×I<sub>кз мин</sub>. I<sub>кз мин за ТР</sub> = ${result.i_kz_min_behind_tr} А</small></p>
        `;
        el.style.display = 'block';
    }

    loadParams();
</script>
</body>
</html>
