<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RZA Calculator - Расчет уставок РЗА</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .content { padding: 40px; }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .result-box {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 5px solid #667eea;
            display: none;
        }
        .result-box.show { display: block; }
        .result-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }
        .formula {
            font-style: italic;
            color: #666;
            margin-top: 10px;
        }
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab {
            padding: 15px 30px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }
        .tab:hover { color: #667eea; }
        .tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            margin-bottom: -2px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .error {
            color: #e74c3c;
            margin-top: 10px;
            padding: 10px;
            background: #fdeaea;
            border-radius: 5px;
        }
        .param-card {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .param-card h3 { margin-bottom: 10px; color: #333; }
        .param-card p { margin: 5px 0; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ RZA Calculator</h1>
            <p>Система расчета уставок релейной защиты и автоматики</p>
        </div>
        
        <div class="content">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('mto')">МТО</button>
                <button class="tab" onclick="switchTab('mtz')">МТЗ</button>
                <button class="tab" onclick="switchTab('parameters')">Параметры</button>
            </div>
            
            <!-- МТО -->
            <div id="mto" class="tab-content active">
                <h2>Расчет максимальной токовой отсечки (МТО)</h2>
                <form id="mto-form" onsubmit="calculateMTO(event)">
                    <div class="form-group">
                        <label for="mto_i_kz_max">Максимальный ток КЗ, А *</label>
                        <input type="number" id="mto_i_kz_max" step="0.01" required placeholder="Например: 1000">
                    </div>
                    <div class="form-group">
                        <label for="mto_u_nom">Номинальное напряжение, кВ</label>
                        <input type="number" id="mto_u_nom" step="0.1" value="6.3" placeholder="6.3">
                    </div>
                    <div class="form-group">
                        <label for="mto_k_n">Коэффициент надежности (k_n)</label>
                        <input type="number" id="mto_k_n" step="0.01" value="1.2" min="1.0" max="1.5">
                    </div>
                    <div class="form-group">
                        <label for="mto_k_ot">Коэффициент отстройки (k_ot)</label>
                        <input type="number" id="mto_k_ot" step="0.01" value="1.0" min="1.0" max="1.3">
                    </div>
                    <button type="submit" class="btn">Рассчитать</button>
                </form>
                <div id="mto-result" class="result-box"></div>
            </div>
            
            <!-- МТЗ -->
            <div id="mtz" class="tab-content">
                <h2>Расчет максимальной токовой защиты (МТЗ)</h2>
                <form id="mtz-form" onsubmit="calculateMTZ(event)">
                    <div class="form-group">
                        <label for="mtz_i_load">Максимальный ток нагрузки, А *</label>
                        <input type="number" id="mtz_i_load" step="0.01" required placeholder="Например: 100">
                    </div>
                    <div class="form-group">
                        <label for="mtz_i_kz_max">Максимальный ток КЗ, А</label>
                        <input type="number" id="mtz_i_kz_max" step="0.01" placeholder="Например: 1000">
                    </div>
                    <div class="form-group">
                        <label for="mtz_k_n">Коэффициент надежности (k_n)</label>
                        <input type="number" id="mtz_k_n" step="0.01" value="1.2" min="1.0" max="1.5">
                    </div>
                    <div class="form-group">
                        <label for="mtz_k_v">Коэффициент возврата (k_v)</label>
                        <input type="number" id="mtz_k_v" step="0.01" value="0.85" min="0.8" max="0.95">
                    </div>
                    <button type="submit" class="btn">Рассчитать</button>
                </form>
                <div id="mtz-result" class="result-box"></div>
            </div>
            
            <!-- Параметры -->
            <div id="parameters" class="tab-content">
                <h2>Входные параметры системы</h2>
                <div id="params-list">Загрузка параметров...</div>
            </div>
        </div>
    </div>

    <script>
        // Переключение вкладок
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        // Расчет МТО
        async function calculateMTO(event) {
            event.preventDefault();
            
            const iKzMax = parseFloat(document.getElementById('mto_i_kz_max').value);
            const uNom = parseFloat(document.getElementById('mto_u_nom').value) || null;
            const kN = parseFloat(document.getElementById('mto_k_n').value) || 1.2;
            const kOt = parseFloat(document.getElementById('mto_k_ot').value) || 1.0;
            
            const data = {
                i_kz_max_3: iKzMax,
                u_nom: uNom,
                k_n: kN,
                k_ot: kOt
            };
            
            try {
                const response = await fetch('/api/calculate/mto', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Ошибка расчета');
                }
                
                const result = await response.json();
                
                document.getElementById('mto-result').innerHTML = `
                    <h3>✓ Результат:</h3>
                    <div class="result-value">${result.setting_value} ${result.unit}</div>
                    <div class="formula">${result.formula_used}</div>
                `;
                document.getElementById('mto-result').classList.add('show');
            } catch (error) {
                document.getElementById('mto-result').innerHTML = `
                    <div class="error">❌ ${error.message}</div>
                `;
                document.getElementById('mto-result').classList.add('show');
            }
        }

        // Расчет МТЗ
        async function calculateMTZ(event) {
            event.preventDefault();
            
            const iLoad = parseFloat(document.getElementById('mtz_i_load').value);
            const iKzMax = parseFloat(document.getElementById('mtz_i_kz_max').value) || null;
            const kN = parseFloat(document.getElementById('mtz_k_n').value) || 1.2;
            const kV = parseFloat(document.getElementById('mtz_k_v').value) || 0.85;
            
            const data = {
                i_load_max: iLoad,
                i_kz_max_3: iKzMax,
                k_n: kN,
                k_v: kV
            };
            
            try {
                const response = await fetch('/api/calculate/mtz', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Ошибка расчета');
                }
                
                const result = await response.json();
                
                document.getElementById('mtz-result').innerHTML = `
                    <h3>✓ Результат:</h3>
                    <div class="result-value">${result.setting_value} ${result.unit}</div>
                    <div class="formula">${result.formula_used}</div>
                `;
                document.getElementById('mtz-result').classList.add('show');
            } catch (error) {
                document.getElementById('mtz-result').innerHTML = `
                    <div class="error">❌ ${error.message}</div>
                `;
                document.getElementById('mtz-result').classList.add('show');
            }
        }

        // Загрузка параметров
        async function loadParameters() {
            try {
                const response = await fetch('/api/parameters');
                const params = await response.json();
                
                const container = document.getElementById('params-list');
                if (!params || params.length === 0) {
                    container.innerHTML = '<p>Параметры не найдены</p>';
                    return;
                }
                
                container.innerHTML = params.map(p => `
                    <div class="param-card">
                        <h3>${p.name || 'Без имени'} (${p.code || 'N/A'})</h3>
                        ${p.description ? `<p>${p.description}</p>` : ''}
                        <p><strong>Ед. изм.:</strong> ${p.unit || '—'}</p>
                        <p><strong>По умолчанию:</strong> ${p.default_value !== null ? p.default_value : '—'} ${p.unit || ''}</p>
                        ${p.min_value !== null || p.max_value !== null ? 
                            `<p><strong>Диапазон:</strong> ${p.min_value || '—'} — ${p.max_value || '—'}</p>` : ''}
                        <p><strong>Обязательный:</strong> ${p.required ? 'Да' : 'Нет'}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('params-list').innerHTML = 
                    `<p style="color: red;">Ошибка: ${error.message}</p>`;
            }
        }

        // Загрузка при старте
        document.addEventListener('DOMContentLoaded', loadParameters);
    </script>
</body>
</html>
